name: Deploy HTML guide to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare HTML site
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          def source_link(match):
              url = match.group(1)
              if url.startswith(("#", "//")) or urlsplit(url).scheme:
                  return match.group(0)
              return f'href="{os.environ["SOURCE_URL"]}{url}"'

          html = Path("GUIDE.ko.html").read_text(encoding="utf-8")
          html = re.sub(r'href="([^"]+)"', source_link, html)
          site = Path("_site")
          site.mkdir()
          (site / "index.html").write_text(html, encoding="utf-8")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
